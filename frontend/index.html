<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reading tracks through the great books, old and new, like the Dutch canon in ten books, and gatherings where readers talk them through together, online or in person." />
    <meta name="theme-color" content="#212529" />
    <title>OR · Read great books together</title>
    <!-- the mark, as in the navbar (public/logo.png): a script O and R on a dark rounded tile.
         favicon.ico is that picture at 16, 32 and 48 px. The pngs are the same for a browser
         that wants a sized icon, and apple-touch-icon.png is the home-screen one. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- what shows until the app has the catalogue and replaces it (main.jsx): LoadingSpinner's
         spinner, drawn here without Bootstrap, which isn't loaded yet -->
    <style>
      .opening { display: flex; align-items: center; justify-content: center; min-height: 50vh; }
      .opening div { width: 2rem; height: 2rem; border: 0.25em solid #fff; border-right-color: transparent; border-radius: 50%; animation: opening 0.75s linear infinite; }
      @keyframes opening { to { transform: rotate(360deg); } }
    </style>
    <div id="root"><div class="opening" role="status" aria-label="Loading…"><div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
