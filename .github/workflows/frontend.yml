name: frontend — build and deploy

# OpenRead's frontend (frontend/): a production build, pointed at the production API; then, on
# pushes to main, uploaded to Azure Static Web Apps and checked. Pull requests build only.
#
# The frontend and the API share a domain (www.openread.cloud, api.openread.cloud): the login cookie is
# only sent between the two when they're the same site.
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_URL: https://api.openread.cloud
  # where the covers and readers' photos are (the API's media storage), for a preconnect
  VITE_MEDIA_URL: https://sideprojectswebapps.blob.core.windows.net

jobs:
  # =========================
  # Build: the static site, calling the production API.
  # =========================
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist
          retention-days: 7

  # =========================
  # Deploy: upload the build to Static Web Apps, then check pages load. Pushes to main only.
  # =========================
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    # One deploy at a time; a queued push waits for the current upload + smoke test to finish.
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

      # On the Static Web App's own address (it works before and after the custom domain): the home
      # page, and deep links the single-page app handles itself (staticwebapp.config.json).
      - name: Smoke test the site
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          for path in / /discover /books /books/frankenstein; do
            for _ in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE$path")
              [ "$code" = "200" ] && break
              sleep 5
            done
            [ "$code" = "200" ] || { echo "::error::Smoke test failed: $path returned HTTP $code"; exit 1; }
            echo "OK  $path → $code"
          done
