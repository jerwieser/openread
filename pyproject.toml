[project]
name = "app-openread"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "azure-communication-email>=1.1.0",
    "azure-storage-blob>=12.26",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.10",
    "pydantic[email]>=2.11",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
extend-exclude = ["db/migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
